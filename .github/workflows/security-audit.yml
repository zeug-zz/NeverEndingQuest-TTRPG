# Security Audit CI Workflow (Python)
# Installed by: security-audit skill

name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2

  sast-bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Bandit
        run: pip install bandit
      - name: Bandit scan
        run: bandit -r . -c pyproject.toml -ll -f json -o bandit-results.json
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: bandit-results
          path: bandit-results.json

  sast-semgrep:
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep SAST
        run: |
          semgrep scan \
            --config auto \
            --config p/flask \
            --config p/bandit \
            --config p/python \
            --config p/secrets \
            --metrics=off \
            --sarif > semgrep-results.sarif
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep-results.sarif

  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit dependencies
        run: pip-audit -r requirements.txt --strict

# Security Audit CI Workflow (Python)
# Installed by: security-audit skill

name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast-bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install Bandit
        run: pip install bandit
      - name: Bandit scan
        run: bandit -r . -c pyproject.toml -lll -f json -o bandit-results.json
      - name: Upload results
        uses: actions/upload-artifact@v7
        with:
          name: bandit-results
          path: bandit-results.json

  sast-semgrep:
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      security-events: write
    container:
      image: returntocorp/semgrep
    steps:
      - uses: actions/checkout@v6
      - name: Semgrep SAST
        run: |
          semgrep scan \
            --config p/flask \
            --config p/bandit \
            --config p/python \
            --config p/secrets \
            --metrics=off \
            --sarif > semgrep-results.sarif
      - name: Normalize SARIF security-severity for CodeQL
        run: |
          python3 - <<'EOF'
          import json
          SEV = {"critical": "9.5", "high": "8.0", "error": "8.0", "medium": "5.0", "warning": "5.0", "low": "2.0", "info": "2.0", "note": "2.0", "none": "0.0"}
          with open("semgrep-results.sarif") as f:
              data = json.load(f)
          for run in data.get("runs", []):
              for rule in run.get("tool", {}).get("driver", {}).get("rules", []):
                  props = rule.get("properties", {})
                  val = props.get("security-severity")
                  if isinstance(val, str):
                      try:
                          float(val)
                      except ValueError:
                          # Unknown label: map it, else drop it so upload succeeds
                          if val.lower() in SEV:
                              props["security-severity"] = SEV[val.lower()]
                          else:
                              del props["security-severity"]
          with open("semgrep-results.sarif", "w") as f:
              json.dump(data, f)
          EOF
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep-results.sarif

  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit dependencies
        # Accepted risk: tornado CVE-2026-115927/116577/116578 (fix 6.6). Every mitmproxy
        # release (latest 12.3.1) caps tornado<=6.5.10, so 6.6 cannot be installed.
        # Tracked in SECURITY.md Accepted Risks; remove when mitmproxy lifts the cap.
        run: |
          pip-audit -r requirements.txt --strict \
            --ignore-vuln CVE-2026-115927 \
            --ignore-vuln CVE-2026-116577 \
            --ignore-vuln CVE-2026-116578

  # setup-node v7.1.0 = 949feb2413d6458794dcd2491c4babbbce0c15c1 and checkout v6.1.0 = d23441a48e516b6c34aea4fa41551a30e30af803, resolved via git ls-remote --tags on 2026-11-06
  frontend-dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Audit frontend lockfile
        working-directory: web/frontend
        run: npm audit --package-lock-only --audit-level=low
